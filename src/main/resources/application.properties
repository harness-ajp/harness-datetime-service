# Harness FME (Feature Management & Experimentation) SDK configuration.
# The SDK key defaults to Split's built-in "localhost" offline mode when
# HARNESS_FME_KEY isn't set, which is safe for local development/tests
# (no network calls). In deployed environments HARNESS_FME_KEY is supplied
# at runtime (see Dockerfile / kubernetes manifests).
harness.fme.key=${HARNESS_FME_KEY:localhost}

# Name of the Dark Mode feature flag as defined in Harness FME.
harness.fme.flags.dark-mode=dark_mode
